services:
  oni-web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ONI_WEB_TOKEN: ${ONI_WEB_TOKEN:?Set a random ONI_WEB_TOKEN of at least 24 characters}
      ONI_WEB_ORIGINS: ${ONI_WEB_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      ONI_WEB_SECURE_COOKIE: ${ONI_WEB_SECURE_COOKIE:-false}
    volumes:
      - oni-data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  oni-data:
